<html>
<head>
    <title>Form Register</title>
    <link rel="stylesheet" href="sumat.css">
</head>
<body>
<div class="container">
    <h2>Formulir Register</h2>
    <h5>Isi data dengan teliti, semua informasi akan digunakan untuk keperluan administrasi</h5>
    
    <div id="hasil" class="result hasil">Data akan muncul di sini...</div>
    <label>Nama Lengkap:</label>
    <input type="text" id="nama" placeholder="cth : Abc">
    <label>Umur:</label>
    <input type="text" id="umur" placeholder="cth : 21 Tahun">
    <label>Email:</label>
    <input type="text" id="email" placeholder="cth : Abc123@gmail.com">
    <label>Nomor Telepon:</label>
    <input type="text" id="nomor" placeholder="cth : +62 123 456">	
    <div class="button-group">
        <button id="tampilkanBtn" class="tampilkanBtn" type="button">Daftar Sekarang</button>
        <button id="resetBtn" class="resetBtn" type="button">Reset Formulir</button>
    </div>
</div>
     <script src="sumat.js"></script>
</body>
</html>
